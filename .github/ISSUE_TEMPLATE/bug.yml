name: Bug report
description: Report a reproducible problem without including private workspace data.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Vraxis Code. Do not include credentials, private source, terminal output, local paths, browser content, or task proof containing sensitive data. Use the Security tab for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Vraxis Code version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime or harness
      options:
        - Codex CLI
        - Claude Code
        - OpenCode
        - Cursor Agent
        - Hosted provider
        - Not runtime-specific
        - Other
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the visible behavior and any safe, redacted error text.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a public or synthetic repository when possible.
      placeholder: |
        1. Register a synthetic project...
        2. Start an Ask task...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe incident summary or reviewed support bundle
      description: Paste the safe summary from Recovery & diagnostics, or drag in the exported JSON after reviewing it. Do not attach raw logs or private task evidence.
      placeholder: Optional. Generated locally by Vraxis Code.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private source, terminal output, local paths, browser content, and sensitive task evidence.
          required: true
        - label: This is not a vulnerability report.
          required: true
